Name: harbour-deadascend
Summary: A horde of zombies have chased you to the old radio tower
Version: 1.1.3
Release: 0
Group: Applications
License: MIT
URL: https://blackgrain.dk/games/deadascend/
SCM: https://github.com/larpon/DeadAscend
Sources:
    - '%{name}-%{version}.tar.gz'
#Patches:
#  - 'baz'
Description: |
    A hand-drawn, open source, point'n'click-like 2D adventure game.

    A horde of Zombies chased you to the old radio tower. Your only chance is
    to ascend up through the tower - solving a host of puzzles on your way to
    your rescue.

    %if "%{?vendor}" == "chum"
    Title: Dead Ascend
    Type: desktop-application
    DeveloperName: Black Grain Games
    PackagedBy: nephros
    Categories:
     - Game
    Custom:
      Repo: https://github.com/larpon/DeadAscend/
      PackagingRepo: https://github.com/nephros/harbour-deadascend
    PackageIcon: https://github.com/larpon/DeadAscend/raw/master/gfx/icon.svg
    Screenshots:
     - https://blackgrain.dk/games/deadascend/screenshots/screen3.png
     - https://blackgrain.dk/games/deadascend/screenshots/screen4.png
     - https://blackgrain.dk/games/deadascend/screenshots/screen5.png
    Links:
      Homepage: %{url}
    %endif

SetupOptions: -q -a 1 -n %{name}-%{version}

#Macros:
#Macros2:
#Requires:
PkgBR:
  - qt5-qttools-linguist
  - qt5-qmake
  - sailfish-svg2png
  - qml-rpm-macros
PkgConfigBR:
  - sailfishapp
  - Qt5Qml
  - Qt5Quick
  - Qt5Gui
  - Qt5Multimedia
  - Qt5Widgets
Builder: none
Configure: none
NoIconCache: true
Files:
  - '%license LICENSE'
  - '%{_bindir}/*'
  - '%{_datadir}/%{name}/'
  - '%{_datadir}/applications/%{name}.desktop'
  - '%{_datadir}/icons/*/*/apps/%{name}.png'
  - '%{_datadir}/icons/*/*/apps/%{name}.svg'

RpmLintIgnore:
  - 'summary-too-long'
  - 'description-line-too-long'
  - 'no-changelogname-tag'
  - 'invalid-url'
  - 'desktopfile-without-binary'
  - 'explicit-lib-dependency'
